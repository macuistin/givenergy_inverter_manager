get_dashboard_yaml:
  name: Get dashboard YAML
  description: >
    Writes a Lovelace dashboard pre-filled with your actual entity IDs to
    givenergy_dashboard.yaml in the Home Assistant config directory, then shows a
    persistent notification with setup steps. Paste the file into a new blank
    dashboard via Raw configuration editor, or point a YAML-mode dashboard at it.

    The dashboard has four views: Power Flow, Today, Battery, and Controls.
    View 1 requires power-flow-card-plus from HACS.
  fields: {}

suggest_appliance_run:
  name: Suggest appliance run time
  description: >
    Checks whether now is a good time to run a high-load appliance (washing
    machine, dishwasher, etc.) based on current solar surplus, battery state,
    and the active tariff rate.

    Creates a persistent notification with the verdict and the reason. The
    action does not return a response.
  fields:
    appliance_name:
      name: Appliance name
      description: Name of the appliance (used in the notification)
      required: true
      example: Washing machine
      selector:
        text:
    appliance_power_w:
      name: Appliance power (W)
      description: Rated power consumption of the appliance in watts
      required: true
      example: 2000
      selector:
        number:
          min: 100
          max: 10000
          step: 100
          unit_of_measurement: W

get_roi_summary:
  name: Get ROI summary
  description: >
    Returns return-on-investment figures for today, this week, this month and
    this year, plus battery cycles and remaining life. Use response_variable to
    read the result in a script or automation. Returns an empty response until
    the first update has completed.
  fields: {}

compare_tariff:
  name: Compare tariff
  description: >
    Compares this bill period against a flat-rate alternative tariff, using the
    kWh imported and exported so far this period. Both tariffs are billed the same
    way: energy, supplier saving, standing charge, PSO levy, VAT, then the export
    credit. The alternative uses your tariff's supplier discount, VAT and PSO levy
    unless you enter your own. With more than one entry set up, the response
    lists every entry. Use response_variable to read the result.
  fields:
    rate:
      name: Import rate
      description: Flat import rate of the alternative tariff, per kWh
      required: true
      example: 0.28
      selector:
        number:
          min: 0
          max: 5
          step: 0.001
          mode: box
    standing_charge:
      name: Standing charge per day
      description: Daily standing charge of the alternative tariff
      required: false
      default: 0
      example: 0.65
      selector:
        number:
          min: 0
          max: 5
          step: 0.001
          mode: box
    export_rate:
      name: Export rate
      description: Export rate of the alternative tariff, per kWh
      required: false
      default: 0
      example: 0.15
      selector:
        number:
          min: 0
          max: 1
          step: 0.001
          mode: box
    discount_rate:
      name: Supplier discount
      description: Supplier discount of the alternative tariff in percent. Leave empty to use your tariff's discount
      required: false
      example: 5.5
      selector:
        number:
          min: 0
          max: 20
          step: 0.1
          mode: box
    vat_rate:
      name: VAT rate
      description: VAT of the alternative tariff in percent. Leave empty to use your tariff's VAT rate
      required: false
      example: 9
      selector:
        number:
          min: 0
          max: 30
          step: 0.1
          mode: box
    pso_levy:
      name: PSO levy
      description: PSO levy of the alternative tariff for a whole bill period. Leave empty to use your tariff's PSO levy
      required: false
      example: 1.46
      selector:
        number:
          min: 0
          max: 20
          step: 0.01
          mode: box

year_on_year_summary:
  name: Year-on-year summary
  description: >
    Compares this bill period with the same period one year ago. The comparison
    needs 12 completed bill periods. Until then the response has no_data set to
    true and shows how many periods are stored. Use response_variable to read
    the result.
  fields: {}

export_energy_data:
  name: Export energy data
  description: >
    Writes today, yesterday, this week, this month, this year and each stored
    completed bill period to givenergy_energy_export.csv in the Home Assistant
    config directory, then shows a persistent notification. The action does not
    return a response.
  fields: {}
