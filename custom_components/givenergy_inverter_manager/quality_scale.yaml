# Integration Quality Scale — GivEnergy Inverter Manager
# https://developers.home-assistant.io/docs/core/integration-quality-scale/

rules:
  # ── Bronze ──────────────────────────────────────────────────────────────────
  action-setup: done           # all six actions registered in async_setup; each raises when no entry is loaded
  appropriate-polling: done    # 30s UPDATE_INTERVAL_SECONDS, fits the use case
  brands: done                 # icon.png and logo.png in brand/
  common-modules: done         # coordinator.py, const.py, rules.py
  config-flow-test-coverage: done  # config_flow.py, config_helpers.py and every file in wizard/ are at 100% line coverage in the end-to-end suite (tests/ha_e2e, pytest --cov)
  config-flow: done            # setup wizard (your system with a checklist, tariff, tariff rates, forecast, hot water, confirm) with GivTCP, EV charger and forecast sensor discovery
  dependency-transparency: done  # requirements: [] — relies only on HA built-ins
  docs-actions: done           # docs/actions.md documents all six actions
  docs-conditions:
    status: exempt
    comment: The integration provides no automation conditions, so there is nothing to document
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no automation triggers, so there is nothing to document
  entity-event-setup: done     # time listeners registered in async_on_unload
  entity-unique-id: done       # all entities have unique_id via entry.entry_id + key
  has-entity-name: done        # _attr_has_entity_name = True on all entities
  runtime-data: done           # entry.runtime_data = coordinator
  test-before-configure: done  # setup and reconfigure refuse an inverter entity that does not exist or reads unavailable (unavailable_wiring), before any entry is created
  test-before-setup: done      # async_config_entry_first_refresh raises ConfigEntryNotReady
  unique-config-entry: done    # async_set_unique_id(inverter.serial) in config flow

  # ── Silver ───────────────────────────────────────────────────────────────────
  action-exceptions: done      # all six actions raise ServiceValidationError (no_config_entry) when no entry is loaded
  config-entry-unloading: done # async_unload_entry implemented
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done     # coordinator raises UpdateFailed when solar+battery both stale
  integration-owner: done      # @macuistin in manifest.json
  log-when-unavailable: done   # logs warning on first GivTCP offline; logs info on recovery
  parallel-updates: done       # PARALLEL_UPDATES = 0 on all platforms
  reauthentication-flow:
    status: exempt
    comment: No authentication required — local integration via GivTCP
  test-coverage: done          # every module is above 95% over both suites, checked in CI by scripts/check_coverage.py (the coverage job in tests.yml)

  # ── Gold ─────────────────────────────────────────────────────────────────────
  devices: done                # device_info with identifiers on all entities
  diagnostics: done            # diagnostics.py provides Download Diagnostics; the inverter serial and entity IDs built from it are redacted
  discovery:
    status: exempt
    comment: Nothing announces itself on the network. The setup wizard finds the GivTCP inverter entities by scanning Home Assistant's own states, and the coordinator finds an EV charger the same way. Ends when GivTCP or the inverter offers zeroconf, DHCP or another discovery.
  discovery-update-info:
    status: exempt
    comment: No network address is stored, because the integration reads GivTCP entities and not the inverter. Ends when a backend connects to a host or port.
  docs-data-update: done       # README and update-cycle.mermaid document the 30s cycle
  docs-examples: done          # docs/automations.md with 10 ready-to-use automation examples
  docs-known-limitations: done # REQUIREMENTS.md documents known limitations
  docs-supported-devices: done # README lists supported EV charger brands and GivTCP
  docs-supported-functions: done  # REQUIREMENTS.md sensor/switch/number table
  docs-troubleshooting: done   # docs/troubleshooting.md covers all common failure modes
  docs-use-cases: done         # README describes solar surplus diversion, charge optimisation
  dynamic-devices: done        # the EV charger and Immersion devices appear when their hardware does (optional_devices.async_add_entities_per_device), and take the area of the main device (async_inherit_main_area); tests/ha_e2e/test_device_lifecycle_e2e.py
  entity-category: done        # EntityCategory.DIAGNOSTIC on operational sensors
  entity-device-class: done    # SensorDeviceClass used where appropriate
  entity-disabled-by-default: done  # yesterday/week/month/forecast/HTML report sensors disabled by default
  entity-translations: done    # every sensor, switch and number has a translation_key and a name in strings.json
  exception-translations: done # ConfigEntryNotReady and UpdateFailed use translation_key
  icon-translations: done      # icons.json covers every sensor, switch and number by translation_key
  reconfiguration-flow: done   # async_step_reconfigure remaps the inverter entities (discovery or by hand) with async_update_and_abort; the tariff is in the options wizard
  repair-issues: done          # every repair issue (givtcp_entities_missing, system_looks_different, givtcp_not_answering and the rest) has a learn_more_url and translations
  stale-devices: done          # remove_stale_devices at setup and async_remove_config_entry_device for the user; tests/ha_e2e/test_device_lifecycle_e2e.py

  # ── Platinum ─────────────────────────────────────────────────────────────────
  async-dependency:
    status: exempt
    comment: No external library dependencies
  inject-websession:
    status: exempt
    comment: No HTTP requests made
  strict-typing: todo          # mypy is configured in pyproject.toml but not run in CI, the HA layer is relaxed per module, and there is no py.typed
  