      name: Minimum temp
      color: orange
      tap_action:
        action: none
      icon_tap_action:
        action: none
      grid_options:
        columns: 6
      visibility:
      - condition: state
        entity: number.givenergy_inverter_manager_immersion_target_temperature
        state_not: unavailable
    - type: tile
