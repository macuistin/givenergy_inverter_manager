      grid_options:
        columns: 6
    - type: tile
      entity: sensor.givenergy_inverter_manager_current_rate_period
      name: Rate period
      color: blue
      grid_options:
        columns: 6
  - type: grid
    cards:
    - type: heading
      heading: Solar
      heading_style: title
      icon: mdi:weather-sunny
      tap_action:
        action: navigate
        navigation_path: solar
    - type: tile
