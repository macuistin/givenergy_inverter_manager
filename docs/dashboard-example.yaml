      grid_options:
        columns: full
    - type: markdown
      content: |-
        {% set text = state_attr('sensor.givenergy_inverter_manager_water_heating_cheapest_source', 'oil_schedule_suggestion') %}{% set days = state_attr('sensor.givenergy_inverter_manager_water_heating_cheapest_source', 'oil_schedule_days') %}{% if text -%}
        {{ text }}
        {%- elif days -%}
