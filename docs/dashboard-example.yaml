    - type: markdown
      content: '{{ states(''sensor.givenergy_inverter_manager_immersion_divert_reason'') }}'
      grid_options:
        columns: full
  - type: grid
    visibility:
    - condition: state
      entity: number.givenergy_inverter_manager_immersion_target_temperature
      state_not: unavailable
    - condition: state
      entity: sensor.givenergy_inverter_manager_immersion_water_temperature
      state_not: unavailable
    - condition: state
      entity: switch.givenergy_inverter_manager_immersion_scheduled_heating
      state: 'on'
    cards:
    - type: heading
      heading: Ready by
      heading_style: title
      icon: mdi:clock-check-outline
    - type: markdown
      content: |-
        {% set sensor = 'sensor.givenergy_inverter_manager_immersion_water_temperature' %}{% set ready = state_attr(sensor, 'ready_by') %}{% set expected = state_attr(sensor, 'expected_ready') %}{% set rate = state_attr(sensor, 'heating_rate_c_per_h') %}{% if ready -%}
        **Next ready time {{ ready }}**

        {% if expected is true %}The water is expected to be at the target by then.{% elif expected is false %}The water is not expected to reach the target by then.{% else %}Whether the water will be ready in time is not known yet.{% endif %}{% if is_number(rate) %} Heating at about {{ rate | float(0) | round(1) }} °C an hour.{% endif %}
        {%- else -%}
        No hot water ready time is set. Add one under Hot water ready by in the immersion options.
        {%- endif %}
      grid_options:
        columns: full
    - type: markdown
      content: |-
        {% set text = state_attr('sensor.givenergy_inverter_manager_immersion_water_temperature', 'planned_heating') %}{% if text -%}
        {{ text }}
        {%- else -%}
        The planned heating shows once the water temperature is read.
        {%- endif %}
      grid_options:
        columns: full
    - type: markdown
      content: '{{ state_attr(''sensor.givenergy_inverter_manager_water_heating_cheapest_source'', ''suggestion'') }}'
      grid_options:
        columns: full
      visibility:
      - condition: state
        entity: sensor.givenergy_inverter_manager_water_heating_cheapest_source
        state_not: unavailable
  - type: grid
