# GivEnergy Inverter Manager — Generated Dashboard
# Generated by: Developer Tools → Actions → givenergy_inverter_manager.get_dashboard_yaml
#
# The live power flow requires power-flow-card-plus from HACS:
#   https://github.com/flixlix/power-flow-card-plus
# The immersion charts require apexcharts-card from HACS:
#   https://github.com/RomRider/apexcharts-card
# All other views use only built-in HA cards.
#
# To use: Settings → Dashboards → new blank dashboard
#         Three-dot menu → Edit dashboard → Raw configuration editor → paste

views:
- title: Power Flow
  icon: mdi:solar-power-variant
  path: power-flow
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Now
      heading_style: title
      icon: mdi:clock-outline
    - type: tile
      entity: sensor.givenergy_inverter_manager_battery_state_of_charge
      name: Battery
      color: green
      features:
      - type: bar-gauge
        min: 0
        max: 100
      tap_action:
        action: navigate
        navigation_path: battery
      icon_tap_action:
        action: navigate
        navigation_path: battery
      grid_options:
        columns: 6
        rows: 3
    - type: tile
      entity: sensor.givenergy_inverter_manager_night_survival_confidence
      name: Night survival
      color: indigo
      tap_action:
        action: navigate
        navigation_path: battery-detail
      icon_tap_action:
        action: navigate
        navigation_path: battery-detail
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.givenergy_inverter_manager_current_rate
      name: Rate now
      color: blue
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.givenergy_inverter_manager_import_cost_today
      name: Cost today
      color: blue
      tap_action:
        action: navigate
        navigation_path: today
      icon_tap_action:
        action: navigate
        navigation_path: today
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.givenergy_inverter_manager_next_cheap_rate_start
      name: Cheap from
      color: blue
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.givenergy_inverter_manager_hours_to_cheap_rate
      name: Cheap in
      icon: mdi:timer-outline
      color: blue
      grid_options:
        columns: 6
  - type: grid
    cards:
    - type: heading
      heading: Live power flow
      heading_style: title
      icon: mdi:transmission-tower
    - type: custom:power-flow-card-plus
      entities:
        solar:
          entity: sensor.givenergy_inverter_manager_solar_power
          color_icon: false
          color_value: false
          invert_state: false
          secondary_info_entity: sensor.givenergy_inverter_manager_inverter_clipping
          secondary_info:
            template: '{{- "·⚡Clip" if states("sensor.givenergy_inverter_manager_inverter_clipping") == "clipping" else "" }}'
        battery:
          entity: sensor.givenergy_inverter_manager_battery_power
          state_of_charge: sensor.givenergy_inverter_manager_battery_state_of_charge
          show_state_of_charge: true
        grid:
          entity: sensor.givenergy_inverter_manager_grid_power
          use_metadata: false
          invert_state: false
          display_state: one_way
          secondary_info:
            entity: sensor.givenergy_inverter_manager_live_grid_cost_rate
            icon: mdi:cash-clock
            decimals: 4
            display_zero: true
            color_value: false
            unit_of_measurement: ' '
        home:
          entity: sensor.givenergy_inverter_manager_house_load
          subtract_individual: false
          hide: false
        individual:
        - entity: sensor.givenergy_inverter_manager_ev_charging_power
          name: Car Charger
          icon: mdi:car-electric
          display_zero: false
          color: '#4CAF50'
        - entity: sensor.givenergy_inverter_manager_immersion_heater_power
          name: Immersion
          icon: mdi:water-boiler
          display_zero: false
          color: '#FF9800'
      min_flow_rate: 0.75
      max_flow_rate: 6
      display_zero_lines:
        mode: transparency
        transparency: 75
        grey_color:
        - 189
        - 189
        - 189
      allow_layout_break: false
      kilo_threshold: 1000
      base_decimals: 0
      kilo_decimals: 1
      disable_dots: false
      clickable_entities: true
      no_labels: false
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Energy today
      heading_style: title
      icon: mdi:lightning-bolt
      tap_action:
        action: navigate
        navigation_path: today
    - type: tile
      entity: sensor.givenergy_inverter_manager_solar_generation_today
      name: Generated
      color: amber
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.givenergy_inverter_manager_house_load_today
      name: Used
      color: blue
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.givenergy_inverter_manager_grid_import_today
      name: Imported
      color: blue
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.givenergy_inverter_manager_grid_export_today
      name: Exported
      color: blue
      grid_options:
        columns: 6
    - type: heading
      heading: Devices
      heading_style: title
      icon: mdi:power-plug
    - type: tile
      entity: sensor.hot_water_cylinder_temperature
      name: Immersion
      icon: mdi:water-boiler
      color: orange
      tap_action:
        action: navigate
        navigation_path: immersion
      icon_tap_action:
        action: navigate
        navigation_path: immersion
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.givenergy_inverter_manager_ev_charger_state
      name: EV charger
      icon: mdi:ev-station
      color: teal
      tap_action:
        action: navigate
        navigation_path: ev-charger
      icon_tap_action:
        action: navigate
        navigation_path: ev-charger
      grid_options:
        columns: 6
