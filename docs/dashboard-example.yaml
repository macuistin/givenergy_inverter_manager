        columns: 6
    - type: tile
      entity: sensor.givenergy_inverter_manager_battery_power
      name: Power
      color: green
      features:
      - type: trend-graph
        hours_to_show: 24
      grid_options:
        columns: 6
    - type: history-graph
      entities:
      - entity: sensor.givenergy_inverter_manager_battery_state_of_charge
        name: Charge
      hours_to_show: 24
      grid_options:
        columns: full
        rows: 4
  - type: grid
    cards:
    - type: heading
      heading: Tonight's charge plan
      heading_style: title
      icon: mdi:weather-night
    - type: tile
      entity: sensor.givenergy_inverter_manager_recommended_overnight_charge_target
