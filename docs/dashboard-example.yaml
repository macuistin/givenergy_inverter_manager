        columns: 6
- title: Controls
  icon: mdi:tune
  path: controls
  type: sections
  max_columns: 3
  sections:
  - type: grid
    visibility:
    - condition: state
      entity: sensor.givenergy_inverter_manager_dry_run_mode_active
      state: 'True'
    cards:
    - type: heading
      heading: Dry run is on
      heading_style: title
      icon: mdi:test-tube
    - type: markdown
      content: |-
        No commands are sent to your inverter or EV charger. Sensors and charge decisions still update. To go live, turn off Dry Run in Settings, Devices & services, GivEnergy Inverter Manager, Configure.

        **Last skipped action:** {{ states('sensor.givenergy_inverter_manager_last_skipped_action_dry_run') }}
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Overnight charging
      heading_style: title
      icon: mdi:battery-charging
    - type: tile
      entity: number.givenergy_inverter_manager_overnight_charge_target_override
      name: Charge target
      color: green
      features:
      - type: numeric-input
        style: slider
      grid_options:
        columns: full
    - type: tile
      entity: switch.givenergy_inverter_manager_enable_charge_target_override
      name: Use target
      color: green
      features:
      - type: toggle
      features_position: inline
      grid_options:
        columns: 6
    - type: tile
      entity: switch.givenergy_inverter_manager_force_skip_overnight_charge
      name: Skip tonight
      color: green
      features:
      - type: toggle
      features_position: inline
      grid_options:
        columns: 6
  - type: grid
    cards:
    - type: heading
      heading: Immersion heater
      heading_style: title
      icon: mdi:water-boiler
    - type: tile
      entity: switch.givenergy_inverter_manager_auto_immersion_divert
      name: Auto divert
      color: orange
      features:
      - type: toggle
      features_position: inline
      grid_options:
        columns: 6
    - type: tile
      entity: switch.givenergy_inverter_manager_immersion_heater_managed
      name: Managed
      color: orange
      features:
      - type: toggle
      features_position: inline
      grid_options:
        columns: 6
    - type: markdown
      content: '{{ states(''sensor.givenergy_inverter_manager_immersion_divert_reason'') }}'
      grid_options:
        columns: full
    - type: tile
      entity: number.givenergy_inverter_manager_immersion_target_temperature
      name: Target temp
      color: orange
      features:
      - type: numeric-input
        style: slider
      grid_options:
        columns: full
    - type: tile
      entity: number.givenergy_inverter_manager_immersion_minimum_temperature
      name: Minimum temp
      color: orange
      features:
      - type: numeric-input
        style: slider
      grid_options:
        columns: full
    - type: tile
      entity: number.givenergy_inverter_manager_immersion_restart_gap
      name: Restart gap
      color: orange
      features:
      - type: numeric-input
        style: slider
      grid_options:
        columns: full
- title: Immersion
  icon: mdi:water-boiler
  path: immersion
  type: sections
  max_columns: 3
  subview: true
  back_path: power-flow
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Water temperature
      heading_style: title
      icon: mdi:thermometer-water
    - type: custom:apexcharts-card
      header:
        show: false
      graph_span: 12h
      apex_config:
        chart:
          height: 180
          zoom:
            enabled: false
        tooltip:
          shared: true
          followCursor: true
        stroke:
          curve: smooth
          width: 2
        markers:
          size: 0
          hover:
            size: 5
        legend:
          show: true
          position: bottom
      series:
      - entity: sensor.hot_water_cylinder_temperature
        name: Water
        color: '#03a9f4'
        stroke_width: 2
      - entity: number.givenergy_inverter_manager_immersion_target_temperature
        name: Target
        color: '#f44336'
        stroke_width: 1
      - entity: number.givenergy_inverter_manager_immersion_minimum_temperature
        name: Minimum
        color: '#ff9800'
        stroke_width: 1
      grid_options:
        columns: full
    - type: heading
      heading: Why
      heading_style: subtitle
      icon: mdi:help-circle-outline
    - type: markdown
      content: '{{ states(''sensor.givenergy_inverter_manager_immersion_divert_reason'') }}'
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Heater power
      heading_style: title
      icon: mdi:flash
    - type: custom:apexcharts-card
      header:
        show: false
      graph_span: 12h
      yaxis:
      - min: 0
      apex_config:
        chart:
          height: 180
          zoom:
            enabled: false
        tooltip:
          shared: true
          followCursor: true
        stroke:
          curve: stepline
          width: 2
        markers:
          size: 0
          hover:
            size: 5
        legend:
          show: false
      series:
      - entity: sensor.givenergy_inverter_manager_immersion_heater_power
        name: Power
        color: '#ff9800'
        stroke_width: 2
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Today
      heading_style: title
      icon: mdi:calendar-today
    - type: tile
      entity: sensor.givenergy_inverter_manager_immersion_heater_today
      name: Energy
      color: orange
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.givenergy_inverter_manager_immersion_cost_today
      name: Cost
      color: blue
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.givenergy_inverter_manager_immersion_solar_savings
      name: Saved by solar
      color: green
      grid_options:
        columns: 6
