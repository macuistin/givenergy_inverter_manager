      days_to_show: 2
      stat_types:
      - change
      grid_options:
        columns: full
        rows: 4
- title: Tariff
  icon: mdi:table
  path: tariff
  type: sections
  max_columns: 3
  subview: true
  back_path: bill
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Tariff in use
      heading_style: title
      icon: mdi:table
    - type: markdown
      content: |-
        | Period | Window | Rate per kWh | Billed per kWh |
        |---|---|---:|---:|
        | Day | all other times | €0.3334 | €0.3434 |
        | Night | 23:00 to 08:00 | €0.1644 | €0.1693 |
        | Nightboost | 02:00 to 04:00 | €0.0965 | €0.0994 |

        Billed per kWh is the rate less the 5.5% discount, plus 9% VAT. Where periods overlap, the cheapest applies.

        | Other charge | Value |
        |---|---:|
        | Export rate | €0.1950 per kWh |
        | Standing charge | €0.8259 per day |
        | PSO levy | €1.46 per bill period |
        | Bill starts on day | 1 |
      grid_options:
        columns: full
- title: Battery detail
  icon: mdi:battery-heart-variant
  path: battery-detail
  type: sections
  max_columns: 3
  subview: true
  back_path: battery
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Night survival
      heading_style: title
      icon: mdi:weather-night
    - type: markdown
      content: |-
        {% set level = states('sensor.givenergy_inverter_manager_night_survival_confidence') %}**Night survival: {{ level }}**

        {% if state_attr('sensor.givenergy_inverter_manager_night_survival_confidence', 'explanation') -%}
        {{ state_attr('sensor.givenergy_inverter_manager_night_survival_confidence', 'explanation') }}
        {%- elif level | lower == 'warning' -%}
        The battery should last until solar starts, but only just. It is expected to reach {% if has_value('sensor.givenergy_inverter_manager_estimated_soc_at_sunrise') %}about {{ states('sensor.givenergy_inverter_manager_estimated_soc_at_sunrise') | float(0) | round(0) | int }}% at sunrise{% else %}the minimum at sunrise{% endif %}, close to your minimum charge. A warning shows when the estimate is within 5 points of the minimum.
        {%- else -%}
        {{ states('sensor.givenergy_inverter_manager_battery_night_survival_status') }}
        {%- endif %}
      grid_options:
        columns: full
    - type: heading
      heading: Tonight's charge target
      heading_style: subtitle
      icon: mdi:battery-charging
    - type: markdown
      content: '{{ states(''sensor.givenergy_inverter_manager_overnight_charge_reason'') }}'
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Battery health
      heading_style: title
      icon: mdi:battery-heart-variant
    - type: tile
      entity: sensor.givenergy_inverter_manager_battery_total_cycles
      name: Total cycles
      color: green
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.givenergy_inverter_manager_battery_remaining_life
      name: Life remaining
      color: green
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.givenergy_inverter_manager_days_since_full_charge
      name: Since full
      icon: mdi:battery-check
      color: green
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.givenergy_inverter_manager_inverter_temperature
      name: Inverter temp
      color: blue
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.givenergy_inverter_manager_inverter_temperature_status
      name: Inverter status
      icon: mdi:thermometer-alert
      color: blue
      grid_options:
        columns: 6
