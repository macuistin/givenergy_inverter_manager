# GivEnergy Inverter Manager — Generated Dashboard
# Generated by: Developer Tools → Actions → givenergy_inverter_manager.get_dashboard_yaml
#
# The live power flow requires power-flow-card-plus from HACS:
#   https://github.com/flixlix/power-flow-card-plus
# The immersion and solar forecast charts require apexcharts-card from HACS:
#   https://github.com/RomRider/apexcharts-card
# All other views use only built-in HA cards.
#
# To use: Settings → Dashboards → new blank dashboard
#         Three-dot menu → Edit dashboard → Raw configuration editor → paste

views:
- title: Power Flow
  icon: mdi:solar-power-variant
  path: power-flow
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Now
      heading_style: title
      icon: mdi:clock-outline
      badges:
      - type: button
        icon: mdi:tune
        text: Settings
        tap_action:
          action: navigate
          navigation_path: settings
        visibility:
        - condition: user
          users:
          - a0b1c2d3e4f5061728394a5b6c7d8e9f
    - type: tile
      entity: sensor.givenergy_inverter_manager_battery_state_of_charge
      name: Battery
      color: green
      features:
      - type: bar-gauge
        min: 0
        max: 100
      tap_action:
        action: navigate
        navigation_path: battery
      icon_tap_action:
        action: navigate
        navigation_path: battery
      grid_options:
        columns: 6
        rows: 2
    - type: tile
      entity: sensor.givenergy_inverter_manager_current_rate
      name: Rate per kWh
      color: blue
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.givenergy_inverter_manager_import_cost_today
      name: Cost today
      color: blue
      tap_action:
        action: navigate
        navigation_path: today
      icon_tap_action:
        action: navigate
        navigation_path: today
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.givenergy_inverter_manager_battery_overnight_confidence
      name: Battery overnight
      color: indigo
      state_content:
      - summary
      tap_action:
        action: navigate
        navigation_path: battery-detail
      icon_tap_action:
        action: navigate
        navigation_path: battery-detail
      grid_options:
        columns: full
    - type: tile
      entity: sensor.givenergy_inverter_manager_next_cheap_rate_start
      name: Cheap from
      color: blue
      state_content:
      - summary
      grid_options:
        columns: full
  - type: grid
    visibility:
    - condition: state
      entity: sensor.givenergy_inverter_manager_dry_run_mode_active
      state: 'True'
    cards:
    - type: heading
      heading: Dry run is on
      heading_style: title
      icon: mdi:test-tube
    - type: markdown
      content: |-
        No commands are sent to your inverter or EV charger. Sensors and charge decisions still update. To go live, turn off Dry Run in Settings, Devices & services, GivEnergy Inverter Manager, Configure.

        **Last skipped action:** {{ states('sensor.givenergy_inverter_manager_last_skipped_action_dry_run') }}
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Live power flow
      heading_style: title
      icon: mdi:transmission-tower
    - type: custom:power-flow-card-plus
      entities:
        solar:
          entity: sensor.givenergy_inverter_manager_solar_power
          color_icon: false
          color_value: false
          invert_state: false
          secondary_info_entity: sensor.givenergy_inverter_manager_inverter_clipping
          secondary_info:
            template: '{{- "·⚡Clip" if states("sensor.givenergy_inverter_manager_inverter_clipping") == "clipping" else "" }}'
        battery:
          entity: sensor.givenergy_inverter_manager_battery_power
          invert_state: true
          state_of_charge: sensor.givenergy_inverter_manager_battery_state_of_charge
          show_state_of_charge: true
        grid:
          entity: sensor.givenergy_inverter_manager_grid_power
          use_metadata: false
          invert_state: false
          display_state: one_way
          secondary_info:
            entity: sensor.givenergy_inverter_manager_live_grid_cost_rate
            icon: mdi:cash-clock
            decimals: 4
            display_zero: true
            color_value: false
            unit_of_measurement: ' '
        home:
          entity: sensor.givenergy_inverter_manager_house_load
          subtract_individual: false
          hide: false
      min_flow_rate: 0.75
      max_flow_rate: 6
      display_zero_lines:
        mode: transparency
        transparency: 75
        grey_color:
        - 189
        - 189
        - 189
      allow_layout_break: false
      kilo_threshold: 1000
      base_decimals: 0
      kilo_decimals: 1
      disable_dots: false
      clickable_entities: true
      no_labels: false
      grid_options:
        columns: full
