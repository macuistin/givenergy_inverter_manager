# Own ini file on purpose. pytest picks the closest ini file to the test
# arguments, so `pytest tests/ha_e2e` uses this file and never loads
# tests/conftest.py (which stubs homeassistant in sys.modules). That stub would
# corrupt the real homeassistant package these tests need.
[pytest]
testpaths = .
python_files = test_*.py
asyncio_mode = auto
addopts = --tb=short
pythonpath = ../..
filterwarnings =
    ignore::DeprecationWarning
