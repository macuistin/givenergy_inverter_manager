[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "givenergy_inverter_manager"
version = "0.21.0"
requires-python = ">=3.14.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# tests/ha_e2e needs a real Home Assistant and its own virtualenv, so the stubbed
# suite never collects it. See docs/testing.md.
addopts = "--tb=short --ignore=tests/ha_e2e"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["custom_components/givenergy_inverter_manager"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    # The body of a Protocol method.
    "^\\s*\\.\\.\\.$",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "N", "C", "I", "C901", "PLR0912", "PLR0913", "PLR0915", "FBT001", "FBT002"]
# E501 is enforced by line-length above; listing it in ignore would defeat that
ignore = ["N818"]

# Clean Code limits. New code must stay inside them. Existing offenders carry an inline
# `# noqa: <rule>` marker that the refactor which fixes the function deletes.
[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 4
max-statements = 30
max-branches = 10

[tool.ruff.lint.per-file-ignores]
# HA voluptuous schema definitions are inherently verbose and cannot be
# split without losing readability — the dict key IS the schema declaration
"custom_components/*/config_flow.py" = ["E501"]
"tests/*" = ["E501", "C901", "PLR0912", "PLR0913", "PLR0915", "FBT001", "FBT002"]
# The mock and fixtures are test support and held to the same limits as tests.
"packages/givtcp_mock/*" = ["E501", "C901", "PLR0912", "PLR0913", "PLR0915", "FBT001", "FBT002"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
ignore_missing_imports = true

# Modules not yet strictly typed. Each pull request in the strict typing series removes
# some of these, and the last one removes the table. Never add a module to it.
[[tool.mypy.overrides]]
module = [
    "givenergy_inverter_manager",
    "givenergy_inverter_manager.accumulation",
    "givenergy_inverter_manager.active_repairs",
    "givenergy_inverter_manager.coordinator",
    "givenergy_inverter_manager.core.alt_heat_advice",
    "givenergy_inverter_manager.core.alt_heat_schedule",
    "givenergy_inverter_manager.core.alt_heat_start",
    "givenergy_inverter_manager.core.alt_heat_trigger",
    "givenergy_inverter_manager.core.bill_days",
    "givenergy_inverter_manager.core.engine",
    "givenergy_inverter_manager.core.ev_base_rate",
    "givenergy_inverter_manager.core.givtcp_version",
    "givenergy_inverter_manager.core.reporting",
    "givenergy_inverter_manager.core.stored_dashboard",
    "givenergy_inverter_manager.core.wizard_model",
    "givenergy_inverter_manager.core.wizard_pages",
    "givenergy_inverter_manager.core.wizard_tariff",
    "givenergy_inverter_manager.core.write_log",
    "givenergy_inverter_manager.dashboard.cards",
    "givenergy_inverter_manager.dashboard.charts",
    "givenergy_inverter_manager.dashboard.devices",
    "givenergy_inverter_manager.dashboard.registry",
    "givenergy_inverter_manager.dashboard.render",
    "givenergy_inverter_manager.dashboard.templates",
    "givenergy_inverter_manager.dashboard.views",
    "givenergy_inverter_manager.entity",
    "givenergy_inverter_manager.logging",
    "givenergy_inverter_manager.number",
    "givenergy_inverter_manager.optional_devices",
    "givenergy_inverter_manager.repair_flows",
    "givenergy_inverter_manager.sensor",
    "givenergy_inverter_manager.services",
    "givenergy_inverter_manager.stored_dashboard_repair",
    "givenergy_inverter_manager.strategy",
    "givenergy_inverter_manager.switch",
    "givenergy_inverter_manager.wizard.options_flow",
    "givenergy_inverter_manager.wizard.schemas",
    "givenergy_inverter_manager.wizard.selectors",
]
ignore_errors = true

