name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Home Assistant 2026.2, the minimum in hacs.json, needs Python 3.13.2 or newer.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Lint
        run: ruff check custom_components/givenergy_inverter_manager/ tests/
      - name: Security scan
        run: bandit -r custom_components/givenergy_inverter_manager/ -c .bandit.yaml

  tests-python:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Run tests
        run: python -m pytest tests/ -q

  e2e:
    name: Home Assistant end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test-e2e.txt
      - name: Install dependencies
        run: pip install -r requirements-test-e2e.txt
      - name: Run end-to-end tests
        run: python -m pytest tests/ha_e2e -q
