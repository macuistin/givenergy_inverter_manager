name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Home Assistant 2026.2, the minimum in hacs.json, needs Python 3.13.2 or newer.
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Lint
        run: ruff check custom_components/givenergy_inverter_manager/ tests/
      - name: Security scan
        run: bandit -r custom_components/givenergy_inverter_manager/ -c .bandit.yaml
      - name: Run tests
        run: python -m pytest tests/ -q

  tests-python:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Run tests
        run: python -m pytest tests/ -q

  e2e:
    name: Home Assistant end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements-test-e2e.txt
      - name: Run end-to-end tests
        run: python -m pytest tests/ha_e2e -q
