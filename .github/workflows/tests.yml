name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Home Assistant 2026.5, the minimum in hacs.json, needs Python 3.14.2 or newer.
          # It does not install on Python 3.13.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Lint
        run: ruff check custom_components tests scripts packages
      - name: Type check
        run: mypy --follow-imports=silent custom_components/givenergy_inverter_manager/lib packages/givtcp_mock/src
      - name: Security scan
        run: bandit -r custom_components/givenergy_inverter_manager/ -c .bandit.yaml

  # The stubbed suite runs against the minimum Home Assistant in hacs.json and the latest
  # release. Both need Python 3.14.2 or newer, so there is one Python version.
  tests-python:
    name: Tests (Home Assistant ${{ matrix.home-assistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - home-assistant: "2026.5.0"
            pin: "homeassistant==2026.5.0"
          - home-assistant: latest
            pin: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install dependencies
        run: pip install -r requirements-test.txt ${{ matrix.pin }}
      - name: Run tests
        run: python -m pytest tests/ packages/givtcp_mock/tests -q --cov
        env:
          COVERAGE_FILE: coverage-unit
      - name: Keep the coverage data
        if: matrix.home-assistant == 'latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage-unit
          include-hidden-files: true

  # Early warning for the next Home Assistant release. A failure here does not fail the
  # workflow. Until a beta is out it resolves to the latest release.
  tests-beta:
    name: Tests (Home Assistant beta, not blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install dependencies
        run: pip install --pre -r requirements-test.txt
      - name: Run tests
        run: python -m pytest tests/ -q

  # Each plugin release pins one Home Assistant version, so a requirements file stands for
  # one Home Assistant version.
  e2e:
    name: Home Assistant end-to-end (${{ matrix.home-assistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - home-assistant: "2026.5.0"
            requirements: tests/ha_e2e/requirements-floor.txt
          - home-assistant: latest
            requirements: requirements-test-e2e.txt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install dependencies
        run: pip install -r ${{ matrix.requirements }}
      - name: Run end-to-end tests
        run: python -m pytest tests/ha_e2e -q --cov
        env:
          COVERAGE_FILE: coverage-e2e
      - name: Keep the coverage data
        if: matrix.home-assistant == 'latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-e2e
          path: coverage-e2e
          include-hidden-files: true

  # The quality scale rule test-coverage: every module above 95% over both suites.
  coverage:
    name: Coverage (every module above 95%)
    runs-on: ubuntu-latest
    needs: [tests-python, e2e]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Install coverage
        run: pip install coverage
      - name: Check every module
        run: python scripts/check_coverage.py coverage-unit coverage-e2e

  e2e-beta:
    name: Home Assistant end-to-end (beta, not blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test-e2e.txt
      - name: Install dependencies
        run: pip install --pre pytest-homeassistant-custom-component -e ./packages/givtcp_mock
      - name: Run end-to-end tests
        run: python -m pytest tests/ha_e2e -q
