version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    # The Home Assistant floor is set by hacs.json and checked by a test, so
    # Dependabot must not raise it. The end-to-end plugin pins its own version.
    ignore:
      - dependency-name: homeassistant
    groups:
      python-test-dependencies:
        patterns: ["*"]
